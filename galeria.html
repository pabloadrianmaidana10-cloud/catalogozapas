  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--bg:#0d0d0d;--card:#171717;--text:#f5f5f5;--muted:#b8b8b8;--accent:#7c3aed;--accent-2:#a855f7}
    body{background:linear-gradient(180deg,#0b0b0b 0%,#111 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    .navbar{background:rgba(13,13,13,.92);backdrop-filter:blur(10px)}
    .navbar-brand{color:#fff!important;font-weight:700}
    .gallery-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .hero{padding:60px 0 30px;text-align:center}
    .hero h1{font-size:clamp(2rem,5vw,3.6rem);font-weight:800;margin-bottom:14px}
    .hero p{color:var(--muted);max-width:650px;margin:0 auto;font-size:1.05rem}
    .btn-main{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:none;padding:12px 22px;border-radius:12px;font-weight:700;text-decoration:none;display:inline-block}
    .btn-main:hover{color:#fff;opacity:.96}
    .btn-outline-light{border-radius:12px;padding:12px 22px;font-weight:700}
    .top-actions{margin-top:24px}
    .gallery-section{padding:18px 0 100px}
    .gallery-caption{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.88rem;margin-bottom:18px}
    .gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
    .photo-link{display:block;border:1px solid rgba(255,255,255,.07);border-radius:22px;overflow:hidden;background:var(--card);box-shadow:0 10px 30px rgba(0,0,0,.18);transition:transform .18s ease,border-color .18s ease}
    .photo-link img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
    .photo-link:hover{transform:translateY(-3px);border-color:var(--accent-2)}
    a:focus-visible,button:focus-visible{outline:3px solid #d8b4fe;outline-offset:4px}
    .whatsapp-float{position:fixed;bottom:20px;right:20px;background:#25d366;color:#101010;padding:14px 20px;border-radius:50px;font-weight:700;text-decoration:none;box-shadow:0 5px 15px rgba(0,0,0,.3);z-index:10}
    .whatsapp-float:hover{background:#3ce37c;color:#101010}
    .photo-viewer{color:var(--text);background:#111;border:1px solid rgba(168,85,247,.35);border-radius:20px;padding:16px;width:min(960px,calc(100% - 24px));max-height:calc(100dvh - 24px);overflow:auto}
    .photo-viewer::backdrop{background:rgba(0,0,0,.9)}
    .viewer-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .viewer-top h2{font-size:1rem;margin:0;font-weight:700}
    .viewer-close,.viewer-arrow{background:#232323;color:#fff;border:1px solid #555;border-radius:12px;min-width:48px;min-height:48px;font-size:24px}
    .viewer-close:hover,.viewer-arrow:hover{background:var(--accent)}
    .viewer-image{display:block;width:100%;height:min(65dvh,700px);object-fit:contain}
    .viewer-bottom{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:12px}
    .viewer-count{margin:0;color:var(--muted);min-width:72px;text-align:center}
    @media(max-width:767px){
      .hero{padding:36px 0 24px}
      .hero p{font-size:.95rem}
      .gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
      .photo-link{border-radius:14px}
      .gallery-caption{font-size:.78rem}
      .navbar-brand{font-size:1rem;white-space:normal}
      .gallery-nav .btn{padding:10px 14px;font-size:.85rem}
      .photo-viewer{padding:12px;border-radius:14px}
      .viewer-image{height:60dvh}
    }
    @media(prefers-reduced-motion:reduce){.photo-link{transition:none}.photo-link:hover{transform:none}}
  </style>
</head>

    <div class="viewer-bottom">

      <p class="viewer-count" id="viewer-count" role="status" aria-live="polite"></p>
      <button class="viewer-arrow" id="next-photo" type="button" aria-label="Foto siguiente">›</button>
    </div>
  </dialog>
  <script>
    (function () {
      var links = Array.from(document.querySelectorAll('.photo-link'));
      var viewer = document.getElementById('photo-viewer');
      // Keep ordinary image links working when the dialog API is unavailable.
      if (!viewer || typeof viewer.showModal !== 'function') return;
      var photo = document.getElementById('viewer-image');
      var count = document.getElementById('viewer-count');
      var current = 0;
      var opener = null;
      var previousOverflow = '';
      function show(index) {
        current = (index + links.length) % links.length;
        photo.src = links[current].href;
        photo.alt = links[current].querySelector('img').alt;
        count.textContent = (current + 1) + ' / ' + links.length;
      }
      links.forEach(function (link, index) {
        link.addEventListener('click', function (event) {
          if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
          event.preventDefault();
          opener = link;
          show(index);
          previousOverflow = document.body.style.overflow;
          viewer.showModal();
          document.body.style.overflow = 'hidden';
        });
      });
      viewer.querySelector('.viewer-close').addEventListener('click', function () { viewer.close(); });
      document.getElementById('previous-photo').addEventListener('click', function () { show(current - 1); });
      document.getElementById('next-photo').addEventListener('click', function () { show(current + 1); });
      viewer.addEventListener('keydown', function (event) {
        if (event.key === 'ArrowLeft') { event.preventDefault(); show(current - 1); }
        if (event.key === 'ArrowRight') { event.preventDefault(); show(current + 1); }
      });
      viewer.addEventListener('click', function (event) {
        if (event.target !== viewer) return;
        var rect = viewer.getBoundingClientRect();
        if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) viewer.close();
      });
      viewer.addEventListener('close', function () {
        document.body.style.overflow = previousOverflow;
        if (opener) opener.focus();
      });
    }());
  </script>
